<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Locked</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#lock {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.lock {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    font-size: 25px;
    font-weight: normal;
}

#timer {
    font-size: 20px;
    color: #aaa;
}

#done {
    display: none;
    text-align: center;
    margin-top: 40vh;
}
</style>
</head>

<body>

<div id="lock">
    <div class="lock">🔒</div>
    <h1>SYSTEM LOCKED</h1>
    <div id="timer">Unlocking in 60 seconds...</div>
</div>

<div id="done">
    <h1>😂 PRANK!</h1>
    <p>Your phone is completely fine.</p>
</div>

<script>
let seconds = 60;

let countdown = setInterval(function () {

    seconds--;

    document.getElementById("timer").innerText =
        "Unlocking in " + seconds + " seconds...";

    if (seconds <= 0) {
        clearInterval(countdown);
        document.getElementById("lock").style.display = "none";
        document.getElementById("done").style.display = "block";
    }

}, 1000);
</script>

</body>
</html>
