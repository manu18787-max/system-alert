<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Alert</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#start{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

#start button{
    background:#fff;
    color:#000;
    border:0;
    padding:16px 25px;
    border-radius:8px;
    font-size:18px;
}

#lock{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.icon{
    font-size:65px;
    margin-bottom:20px;
}

h1{
    font-size:27px;
    font-weight:normal;
}

#timer{
    color:#aaa;
    font-size:19px;
}

#done{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}
</style>
</head>

<body>

<div id="start">
    <div>
        <h2>System Security Check</h2>
        <p>Tap below to continue</p>
        <button onclick="startPrank()">CONTINUE</button>
    </div>
</div>

<div id="lock">
    <div class="icon">🔒</div>
    <h1>SYSTEM LOCKED</h1>
    <div id="timer">Unlocking in 60 seconds...</div>
</div>

<div id="done">
    <h1>😂 PRANK!</h1>
    <p>Your phone is completely fine.</p>
</div>

<script>

async function startPrank(){

    try{
        await document.documentElement.requestFullscreen();
    }catch(e){}

    document.getElementById("start").style.display="none";
    document.getElementById("lock").style.display="flex";

    let seconds=60;

    let countdown=setInterval(function(){

        seconds--;

        document.getElementById("timer").innerText =
            "Unlocking in " + seconds + " seconds...";

        if(seconds<=0){

            clearInterval(countdown);

            if(document.fullscreenElement){
                document.exitFullscreen().catch(()=>{});
            }

            document.getElementById("lock").style.display="none";
            document.getElementById("done").style.display="flex";
        }

    },1000);
}

</script>

</body>
</html>
