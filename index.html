<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Alert</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#lock {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.icon {
    font-size: 60px;
    margin-bottom: 20px;
}

h1 {
    font-size: 26px;
    font-weight: normal;
}

#timer {
    color: #aaa;
    font-size: 19px;
}

#done {
    display: none;
    text-align: center;
    margin-top: 40vh;
}
</style>
</head>

<body>

<div id="lock">
    <div class="icon">🔒</div>

    <h1>SYSTEM LOCKED</h1>

    <div id="timer">
        Unlocking in 60 seconds...
    </div>
</div>

<div id="done">
    <h1>😂 PRANK!</h1>
    <p>Your phone is completely fine.</p>
</div>

<script>

// Keep the prank page in browser history
history.pushState(null, "", location.href);

window.addEventListener("popstate", function () {
    history.pushState(null, "", location.href);
});

// 60-second countdown
let seconds = 60;

let countdown = setInterval(function () {

    seconds--;

    document.getElementById("timer").innerText =
        "Unlocking in " + seconds + " seconds...";

    if (seconds <= 0) {

        clearInterval(countdown);

        document.getElementById("lock").style.display = "none";
        document.getElementById("done").style.display = "block";
    }

}, 1000);

</script>

</body>
</html>
